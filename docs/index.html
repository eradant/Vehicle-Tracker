
<style>
/* ── TerraPrint palette ─────────────────────────────────────── */
:root{
  --tp-bg:        #000000;
  --tp-panel:     #050505;
  --tp-card:      #0c0c0c;
  --tp-surface:   #111111;
  --tp-hover:     #191919;
  --tp-text:      #e0e8f0;
  --tp-muted:     #58656f;
  --tp-dim:       #343e47;
  --tp-border:    #1e1e1e;
  --tp-border-hi: #2a2a2a;
  --tp-accent:    #4d9fff;
  --tp-accent-h:  #70b3ff;
  --tp-accent-d:  rgba(77,159,255,0.08);
  --tp-danger:    #f85149;
  --tp-success:   #3fb950;
  --tp-r:         10px;
}
html,body{background:#000;min-height:100vh}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--tp-text)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* Tabs */
.tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--tp-border);padding:0 8px;background:var(--tp-panel);box-shadow:0 1px 0 rgba(77,159,255,.05),0 4px 20px rgba(0,0,0,.6)}
.tab{padding:10px 16px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--tp-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;letter-spacing:.03em}
.tab:hover{color:var(--tp-text)}
.tab.active{color:var(--tp-text);border-bottom-color:var(--tp-accent);font-weight:600}
.section{display:none}.section.active{display:block}

/* Badges — dark translucent tints */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;letter-spacing:.03em}
.badge-pending{background:rgba(196,127,23,.15);color:#c47f17;border:1px solid rgba(196,127,23,.25)}
.badge-sourced{background:rgba(77,159,255,.12);color:var(--tp-accent);border:1px solid rgba(77,159,255,.22)}
.badge-installed{background:rgba(63,185,80,.12);color:var(--tp-success);border:1px solid rgba(63,185,80,.22)}
.badge-milestone{background:rgba(157,151,227,.12);color:#9d97e3;border:1px solid rgba(157,151,227,.22)}

/* Cards */
.card{background:var(--tp-card);border:1px solid var(--tp-border);border-radius:var(--tp-r);padding:1rem 1.25rem;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.025) inset}

/* Metric grid */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
.metric{background:var(--tp-card);border-radius:var(--tp-r);padding:14px 16px;border:1px solid var(--tp-border);box-shadow:0 2px 12px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.025) inset;transition:border-color .15s}
.metric:hover{border-color:var(--tp-border-hi)}
.metric .num{font-size:24px;font-weight:600;color:var(--tp-text);letter-spacing:-.03em}
.metric .lbl{font-size:10px;font-weight:700;color:var(--tp-dim);margin-top:4px;letter-spacing:1.1px;text-transform:uppercase}

/* Buttons */
.btn{padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;border-radius:7px;transition:all .15s;letter-spacing:.01em}
.btn-primary{background:var(--tp-accent);color:#000;border:1px solid var(--tp-accent);font-weight:600}
.btn-primary:hover{background:var(--tp-accent-h);border-color:var(--tp-accent-h);box-shadow:0 0 20px rgba(77,159,255,.25)}
.btn-ghost{background:var(--tp-surface);border:1px solid var(--tp-border-hi);color:var(--tp-text)}
.btn-ghost:hover{background:var(--tp-hover);border-color:#333}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger-sm{background:none;border:none;color:var(--tp-muted);cursor:pointer;font-size:12px;padding:3px 6px;border-radius:5px;transition:color .12s,background .12s}
.btn-danger-sm:hover{color:var(--tp-danger);background:rgba(248,81,73,.1)}
.btn-danger{background:none;border:none;color:var(--tp-muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:5px;transition:color .12s,background .12s}
.btn-danger:hover{color:var(--tp-danger);background:rgba(248,81,73,.1)}

/* Progress bar */
.progress-bar-wrap{height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;background:var(--tp-success);border-radius:2px;transition:width .4s ease;box-shadow:0 0 8px rgba(63,185,80,.4)}

/* Parts list */
.part-row{display:grid;grid-template-columns:28px 2.5fr 1fr 0.8fr 0.8fr 1fr 36px;gap:6px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--tp-border);font-size:13px;border-radius:6px;transition:background .1s}
.part-row:last-child{border-bottom:none}
.part-row:hover{background:var(--tp-surface)}
.part-header{display:grid;grid-template-columns:28px 2.5fr 1fr 0.8fr 0.8fr 1fr 36px;gap:6px;padding:6px 6px;font-size:10px;font-weight:700;color:var(--tp-dim);border-bottom:1px solid var(--tp-border);letter-spacing:1.1px;text-transform:uppercase}
.rank-btns{display:flex;flex-direction:column;gap:1px}.rank-btn{background:none;border:none;cursor:pointer;color:var(--tp-dim);font-size:10px;padding:1px;line-height:1;border-radius:2px;transition:color .12s}.rank-btn:hover{color:var(--tp-text)}
.editable{cursor:pointer;padding:3px 6px;border-radius:6px;min-height:20px;border:1px solid transparent;transition:background .12s,border-color .12s}
.editable:hover{background:var(--tp-surface);border-color:var(--tp-border)}
.editable input,.editable select{font-size:12px;width:100%;padding:3px 6px;border:1px solid var(--tp-border);border-radius:6px;background:#000;color:var(--tp-text);outline:none;transition:border-color .12s,box-shadow .12s}
.editable input:focus,.editable select:focus{border-color:rgba(77,159,255,.4);box-shadow:0 0 0 3px rgba(77,159,255,.07)}
.system-tag{font-size:11px;font-weight:500;color:var(--tp-muted);background:var(--tp-surface);padding:2px 8px;border-radius:4px;border:1px solid var(--tp-border-hi)}
.form-input{font-size:13px;padding:6px 10px;border:1px solid var(--tp-border);border-radius:7px;background:#000;color:var(--tp-text);outline:none;transition:border-color .12s,box-shadow .12s}
.form-input:focus{border-color:rgba(77,159,255,.4);box-shadow:0 0 0 3px rgba(77,159,255,.07)}

/* Wiring canvas */
.canvas-wrap{position:relative;border:1px solid var(--tp-border);border-radius:var(--tp-r);overflow:hidden;background:var(--tp-panel);box-shadow:0 4px 40px rgba(0,0,0,.95),1px 0 0 var(--tp-border)}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--tp-border);background:var(--tp-panel);align-items:center}
.toolbar .sep{width:1px;height:22px;background:var(--tp-border);margin:0 6px}
.tool-btn{padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--tp-border-hi);border-radius:7px;background:var(--tp-surface);color:var(--tp-text);white-space:nowrap;transition:all .15s;letter-spacing:.01em}
.tool-btn:hover{background:var(--tp-hover);border-color:#333;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.tool-btn:active{transform:scale(.96)}
.wire-cfg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tp-muted)}
.wire-cfg input[type=color]{width:28px;height:26px;padding:2px;border:1px solid var(--tp-border-hi);border-radius:6px;cursor:pointer;background:none}
.wire-cfg input[type=text]{width:80px;font-size:12px;padding:4px 8px;border:1px solid var(--tp-border);border-radius:6px;background:#000;color:var(--tp-text);outline:none;transition:border-color .12s,box-shadow .12s}
.wire-cfg input[type=text]:focus{border-color:rgba(77,159,255,.4);box-shadow:0 0 0 3px rgba(77,159,255,.07)}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--tp-muted);background:rgba(12,12,12,.94);padding:5px 14px;border-radius:20px;border:1px solid var(--tp-border-hi);pointer-events:none;z-index:10;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.8);backdrop-filter:blur(8px)}

/* Inspector */
.inspector{border-top:1px solid var(--tp-border);background:var(--tp-panel);padding:12px 16px;font-size:13px;display:none}
.inspector.open{display:block}
.insp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.insp-label{font-size:10px;font-weight:700;color:var(--tp-dim);min-width:50px;text-transform:uppercase;letter-spacing:1.1px}
.insp-input{font-size:13px;padding:5px 10px;border:1px solid var(--tp-border);border-radius:7px;background:#000;color:var(--tp-text);outline:none;transition:border-color .12s,box-shadow .12s}
.insp-input:focus{border-color:rgba(77,159,255,.4);box-shadow:0 0 0 3px rgba(77,159,255,.07)}
.port-list{display:flex;flex-direction:column;gap:3px;margin:4px 0}
.port-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;background:var(--tp-surface);font-size:12px;border:1px solid transparent;transition:border-color .12s}
.port-item:hover{border-color:var(--tp-border-hi)}
.port-item .side-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--tp-card);color:var(--tp-muted);border:1px solid var(--tp-border);font-weight:500}
.port-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.port-col-header{font-size:10px;font-weight:700;color:var(--tp-dim);margin-bottom:6px;display:flex;align-items:center;text-transform:uppercase;letter-spacing:1.1px}
.add-port-btn{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer;border:1px dashed var(--tp-border-hi);border-radius:7px;background:none;color:var(--tp-muted);width:100%;transition:all .15s;letter-spacing:.01em}
.add-port-btn:hover{border-color:var(--tp-accent);color:var(--tp-accent);background:var(--tp-accent-d)}

/* Build log */
.log-entry{padding:14px 0;border-bottom:1px solid var(--tp-border)}.log-entry:last-child{border-bottom:none}
.log-date{font-size:12px;font-weight:500;color:var(--tp-muted);margin-bottom:4px}
.log-title{font-size:14px;font-weight:600;color:var(--tp-text);margin-bottom:4px;letter-spacing:-.01em}
.log-notes{font-size:13px;color:var(--tp-muted);line-height:1.5}
.milestone-dot{width:10px;height:10px;border-radius:50%;background:#9d97e3;flex-shrink:0;box-shadow:0 0 0 3px rgba(157,151,227,.2)}
</style>
<h2 class="sr-only">1978 Corolla SR5 build tracker v3 with editable parts, wiring canvas with port management, and build log</h2>
<div class="tabs">
  <button class="tab active" onclick="switchTab('parts')"><i class="ti ti-tools" aria-hidden="true"></i> Parts</button>
  <button class="tab" onclick="switchTab('wiring')"><i class="ti ti-plug" aria-hidden="true"></i> Wiring</button>
  <button class="tab" onclick="switchTab('log')"><i class="ti ti-notebook" aria-hidden="true"></i> Build log</button>
  <div id="save-area" style="margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:4px">
    <span id="save-status" style="font-size:11px;font-weight:500;letter-spacing:.04em;padding:3px 10px;border-radius:12px;white-space:nowrap;transition:color .2s,background .2s,border-color .2s;background:rgba(88,101,111,.15);color:#58656f;border:1px solid rgba(88,101,111,.25)">No save file</span>
    <button id="btn-open-file" class="btn btn-ghost btn-sm" onclick="openSaveFile()" style="font-size:11px">Open file</button>
    <button id="btn-new-file"  class="btn btn-ghost btn-sm" onclick="newSaveFile()"  style="font-size:11px">New file</button>
  </div>
</div>

<div id="parts" class="section active">
  <div class="metric-grid" id="metrics"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="addPart()"><i class="ti ti-plus" aria-hidden="true"></i> Add part</button>
    <select id="filter-system" class="form-input" onchange="renderParts()"><option value="">All systems</option><option>Engine</option><option>Drivetrain</option><option>Suspension</option><option>Electrical</option><option>Interior</option><option>Body</option><option>Brakes</option><option>Fuel</option></select>
    <select id="filter-status" class="form-input" onchange="renderParts()"><option value="">All statuses</option><option value="pending">Pending</option><option value="sourced">Sourced</option><option value="installed">Installed</option></select>

  <div class="card" style="padding:0.75rem 1rem;overflow-x:auto">

    <div id="parts-list"></div>
  </div>
</div>

<div id="wiring" class="section">
  <div class="canvas-wrap">
    <div class="toolbar" id="toolbar">
      <button class="tool-btn" onclick="addComp('battery')"><i class="ti ti-battery-charging" aria-hidden="true"></i> Battery</button>
      <button class="tool-btn" onclick="addComp('ecu')"><i class="ti ti-cpu" aria-hidden="true"></i> ECU</button>
      <button class="tool-btn" onclick="addComp('fusebox')"><i class="ti ti-layout-grid" aria-hidden="true"></i> Fuse box</button>
      <button class="tool-btn" onclick="addComp('relay')"><i class="ti ti-switch-horizontal" aria-hidden="true"></i> Relay</button>
      <button class="tool-btn" onclick="addComp('sensor')"><i class="ti ti-activity" aria-hidden="true"></i> Sensor</button>
      <button class="tool-btn" onclick="addComp('switch')"><i class="ti ti-toggle-right" aria-hidden="true"></i> Switch</button>
      <button class="tool-btn" onclick="addComp('motor')"><i class="ti ti-propeller" aria-hidden="true"></i> Motor</button>
      <button class="tool-btn" onclick="addComp('light')"><i class="ti ti-bulb" aria-hidden="true"></i> Light</button>
      <button class="tool-btn" onclick="addComp('ground')"><i class="ti ti-arrow-bar-to-down" aria-hidden="true"></i> GND</button>
      <button class="tool-btn" onclick="addComp('connector')"><i class="ti ti-plug" aria-hidden="true"></i> Conn</button>
      <button class="tool-btn" onclick="addComp('gauge')"><i class="ti ti-gauge" aria-hidden="true"></i> Gauge</button>

      <div class="sep"></div>

        <input type="color" id="wire-color" value="#ff0000" title="Wire color" />
        <input type="text" id="wire-label" placeholder="Label" />
        <input type="text" id="wire-gauge" placeholder="AWG" style="width:50px" />
      </div>
      <div class="sep"></div>
      <button class="tool-btn" onclick="deleteSelected()" title="Delete selected" style="color:var(--tp-danger)"><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>
    <div style="position:relative;height:calc(100vh - 200px);min-height:600px;overflow:hidden" id="svg-container">
      <svg id="canvas" width="100%" height="100%"></svg>
      <div class="hint" id="hint">Drag components to move. Click port → port to wire. Double-click to rename.</div>

    <div class="inspector" id="inspector"></div>

</div>

<div id="log" class="section">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
    <input id="l-title" placeholder="Entry title" class="form-input" style="flex:2;min-width:160px" />
    <input id="l-date" type="date" class="form-input" style="flex:1;min-width:120px" />
    <select id="l-type" class="form-input"><option value="note">Note</option><option value="milestone">Milestone</option></select>
  </div>
  <textarea id="l-notes" placeholder="Notes…" class="form-input" style="width:100%;height:80px;resize:vertical;margin-bottom:8px"></textarea>
  <button class="btn btn-primary" onclick="addLog()" style="margin-bottom:1.5rem"><i class="ti ti-plus" aria-hidden="true"></i> Add entry</button>
  <div id="log-list"></div>
</div>

<script>
// ── IndexedDB helpers — persist FileSystemFileHandle across page loads ──────
const IDB_NAME='vehicle-tracker-fsa',IDB_STORE='handles',IDB_KEY='saveFile';
function idbOpen(){return new Promise((res,rej)=>{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);req.onsuccess=e=>res(e.target.result);req.onerror=e=>rej(e.target.error);});}
function idbPut(v){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,IDB_KEY);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);}));}
function idbGet(){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const req=tx.objectStore(IDB_STORE).get(IDB_KEY);req.onsuccess=e=>res(e.target.result);req.onerror=e=>rej(e.target.error);}));}

const TEMPLATES={
  battery:{name:'Battery',color:'#EF9F27',ports:[{id:'pos',name:'+12V',side:'right'},{id:'neg',name:'GND',side:'right'}]},
  ecu:{name:'ECU',color:'#378ADD',ports:[{id:'ign',name:'IGN',side:'left'},{id:'o2',name:'O2',side:'left'},{id:'map',name:'MAP',side:'left'},{id:'tps',name:'TPS',side:'left'},{id:'inj1',name:'INJ1',side:'right'},{id:'inj2',name:'INJ2',side:'right'},{id:'tach',name:'TACH',side:'right'},{id:'iac',name:'IAC',side:'right'}]},
  fusebox:{name:'Fuse box',color:'#D85A30',ports:[{id:'in',name:'BATT+',side:'left'},{id:'f1',name:'F1',side:'right'},{id:'f2',name:'F2',side:'right'},{id:'f3',name:'F3',side:'right'},{id:'f4',name:'F4',side:'right'}]},
  relay:{name:'Relay',color:'#888780',ports:[{id:'cp',name:'COIL+',side:'left'},{id:'cn',name:'COIL-',side:'left'},{id:'com',name:'COM',side:'right'},{id:'no',name:'NO',side:'right'}]},
  sensor:{name:'Sensor',color:'#1D9E75',ports:[{id:'vref',name:'5V REF',side:'left'},{id:'gnd',name:'GND',side:'left'},{id:'sig',name:'SIG',side:'right'}]},
  switch:{name:'Switch',color:'#888780',ports:[{id:'in',name:'IN',side:'left'},{id:'out',name:'OUT',side:'right'}]},
  motor:{name:'Motor',color:'#7F77DD',ports:[{id:'pos',name:'+',side:'left'},{id:'neg',name:'-',side:'left'}]},
  light:{name:'Light',color:'#EF9F27',ports:[{id:'pos',name:'+',side:'left'},{id:'neg',name:'-',side:'left'}]},
  ground:{name:'GND',color:'#5F5E5A',ports:[{id:'gnd',name:'GND',side:'left'}]},
  connector:{name:'Connector',color:'#888780',ports:[{id:'a1',name:'A1',side:'left'},{id:'a2',name:'A2',side:'left'},{id:'b1',name:'B1',side:'right'},{id:'b2',name:'B2',side:'right'}]},
  gauge:{name:'Gauge',color:'#D4537E',ports:[{id:'sig',name:'SIG',side:'left'},{id:'vcc',name:'VCC',side:'left'},{id:'gnd',name:'GND',side:'left'}]},
  generic:{name:'Custom',color:'#888780',ports:[{id:'in1',name:'IN1',side:'left'},{id:'out1',name:'OUT1',side:'right'}]}
};

let parts=[
  {id:1,name:'4A-GE engine (AE86)',vendor:'Craigslist',cost:800,system:'Engine',status:'pending',need:1},
  {id:2,name:'T50 5-speed trans',vendor:'',cost:250,system:'Drivetrain',status:'pending',need:2},
  {id:3,name:'X27.168 steppers (x6)',vendor:'Digi-Key',cost:24,system:'Electrical',status:'sourced',need:3},
  {id:4,name:'RP2040 Feather',vendor:'Adafruit',cost:12,system:'Electrical',status:'sourced',need:4},
  {id:5,name:'Coilover kit',vendor:'',cost:600,system:'Suspension',status:'pending',need:5}
];
let nextPid=6,editingPart=null,editingField=null;

let comps=[],wires=[],nextCid=1,nextWid=1;
let selectedComp=null,selectedWire=null;
let wiringFrom=null,previewLine=null;
let dragState=null;
let panOff={x:0,y:0},isPanning=false,panStart={x:0,y:0};

let logs=[{title:'Project started — car purchased',date:'2026-06-11',type:'milestone',notes:'Bought the 1978 Corolla SR5 from Medford for $1,800.'}];

let fileHandle=null,_saveTimer=null;

function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['parts','wiring','log'][i]===t));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  if(t==='parts')renderParts();if(t==='wiring')renderCanvas();if(t==='log')renderLog();
}

function badgeHTML(s){return '<span class="badge badge-'+s+'">'+s+'</span>';}

function renderMetrics(){
  const tot=parts.reduce((a,p)=>a+Number(p.cost||0),0);
  const inst=parts.filter(p=>p.status==='installed').length;
  const src=parts.filter(p=>p.status==='sourced').length;
  const pct=parts.length?Math.round(inst/parts.length*100):0;
  document.getElementById('metrics').innerHTML=
    '<div class="metric"><div class="num">$'+tot.toLocaleString()+'</div><div class="lbl">Budget</div></div>'+
    '<div class="metric"><div class="num">'+parts.length+'</div><div class="lbl">Parts</div></div>'+
    '<div class="metric"><div class="num">'+src+'</div><div class="lbl">Sourced</div></div>'+
    '<div class="metric"><div class="num">'+pct+'%<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%"></div></div></div><div class="lbl">Installed</div></div>';
}

function filteredParts(){
  let f=[...parts].sort((a,b)=>a.need-b.need);
  const sys=document.getElementById('filter-system').value;
  const st=document.getElementById('filter-status').value;
  if(sys)f=f.filter(p=>p.system===sys);
  if(st)f=f.filter(p=>p.status===st);
  return f;
}

function renderParts(){
  renderMetrics();
  const list=filteredParts();
  const el=document.getElementById('parts-list');
  if(!list.length){el.innerHTML='<div style="padding:1rem;color:#58656f;font-size:13px">No parts match.</div>';return;}
  el.innerHTML=list.map(p=>{
    const needBar=Math.max(5,100-((p.need-1)/(parts.length||1))*100);
    const needColor=p.need<=2?'#E24B4A':p.need<=4?'#EF9F27':'#85B7EB';
    return '<div class="part-row">'+
      '<div class="rank-btns"><button class="rank-btn" onclick="moveNeed('+p.id+',-1)">&#9650;</button><button class="rank-btn" onclick="moveNeed('+p.id+',1)">&#9660;</button></div>'+
      '<div>'+ef(p,'name',p.name)+(p.vendor?'<div style="font-size:11px;color:#58656f">'+ef(p,'vendor',p.vendor)+'</div>':'<div class="editable" style="font-size:11px" onclick="startEdit('+p.id+',\'vendor\')"><span style="color:#343e47">+ vendor</span></div>')+'</div>'+
      '<div>'+esel(p,'system',p.system,['Engine','Drivetrain','Suspension','Electrical','Interior','Body','Brakes','Fuel'])+'</div>'+
      '<div>'+ef(p,'cost','$'+(Number(p.cost)||0).toLocaleString())+'</div>'+
      '<div>'+esel(p,'status',p.status,['pending','sourced','installed'])+'</div>'+
      '<div style="display:flex;align-items:center;gap:4px"><span style="font-size:12px;color:#58656f">#'+p.need+'</span><div style="flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px"><div style="height:100%;width:'+needBar+'%;background:'+needColor+';border-radius:2px"></div></div></div>'+
      '<button class="btn-danger" onclick="removePart('+p.id+')" aria-label="Remove"><i class="ti ti-x"></i></button></div>';
  }).join('');
}

function ef(p,field,display){
  if(editingPart===p.id&&editingField===field){
    const v=field==='cost'?p.cost:p[field];
    return '<span class="editable"><input type="'+(field==='cost'?'number':'text')+'" value="'+(v||'')+'" onblur="commitEdit('+p.id+',\''+field+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()" autofocus /></span>';
  }
  return '<span class="editable" onclick="startEdit('+p.id+',\''+field+'\')">'+display+'</span>';
}
function esel(p,field,val,opts){
  if(editingPart===p.id&&editingField===field){
    return '<span class="editable"><select onchange="commitEdit('+p.id+',\''+field+'\',this.value)" onblur="cancelEdit()">'+opts.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></span>';
  }
  return '<span class="editable" onclick="startEdit('+p.id+',\''+field+'\')">'+(field==='status'?badgeHTML(val):'<span class="system-tag">'+val+'</span>')+'</span>';
}
function startEdit(id,f){editingPart=id;editingField=f;renderParts();}
function cancelEdit(){editingPart=null;editingField=null;renderParts();}
function commitEdit(id,f,v){const p=parts.find(x=>x.id===id);if(p){if(f==='cost')p.cost=Number(v)||0;else p[f]=v;}editingPart=null;editingField=null;renderParts();save();}
function moveNeed(id,dir){const p=parts.find(x=>x.id===id);if(!p)return;const n=p.need+dir;if(n<1||n>parts.length)return;const o=parts.find(x=>x.need===n);if(o)o.need=p.need;p.need=n;renderParts();save();}
function addPart(){parts.push({id:nextPid++,name:'New part',vendor:'',cost:0,system:'Engine',status:'pending',need:parts.length+1});editingPart=parts[parts.length-1].id;editingField='name';renderParts();save();}
function removePart(id){parts=parts.filter(p=>p.id!==id);parts.sort((a,b)=>a.need-b.need).forEach((p,i)=>p.need=i+1);renderParts();save();}

const svg=document.getElementById('canvas');
const C={bg:'#050505',grid:'rgba(255,255,255,0.025)',text:'#e0e8f0',muted:'#58656f',portFill:'#111111',compBg:'#111111',selStroke:'#4d9fff'};

function portPos(comp,pid){
  const port=comp.ports.find(p=>p.id===pid);
  if(!port)return{x:0,y:0};
  const side=port.side==='left'?comp.ports.filter(p=>p.side==='left'):comp.ports.filter(p=>p.side==='right');
  const idx=side.indexOf(port);
  const py=28+14+idx*24;
  return{x:comp.x+(port.side==='left'?0:comp.w)+panOff.x,y:comp.y+py+panOff.y};
}
function compH(comp){
  const l=comp.ports.filter(p=>p.side==='left').length;
  const r=comp.ports.filter(p=>p.side==='right').length;
  return 28+14+Math.max(l,r,1)*24+4;
}

function svgCoords(e){
  const rect=svg.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  const sx=vb.width/rect.width;
  return{x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sx};
}

function renderCanvas(){
  const ct=document.getElementById('svg-container');
  const w=ct.clientWidth,h=ct.clientHeight;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  let s='<defs><pattern id="gd" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="'+C.grid+'" stroke-width="0.5"/></pattern></defs>';
  s+='<rect width="'+w+'" height="'+h+'" fill="'+C.bg+'"/><rect width="'+w+'" height="'+h+'" fill="url(#gd)"/>';

  wires.forEach(wr=>{
    const fc=comps.find(c=>c.id===wr.fromComp),tc=comps.find(c=>c.id===wr.toComp);
    if(!fc||!tc)return;
    const fp=portPos(fc,wr.fromPort),tp=portPos(tc,wr.toPort);
    const dx=Math.max(Math.abs(tp.x-fp.x)*0.45,40);
    const sel=selectedWire===wr.id;
    s+='<path d="M'+fp.x+' '+fp.y+'C'+(fp.x+(fp.x<tp.x?dx:-dx))+' '+fp.y+' '+(tp.x+(fp.x<tp.x?-dx:dx))+' '+tp.y+' '+tp.x+' '+tp.y+'" fill="none" stroke="'+(sel?C.selStroke:wr.color)+'" stroke-width="'+(sel?3:2)+'" data-wire="'+wr.id+'" style="cursor:pointer"/>';
    if(wr.label){
      const mx=(fp.x+tp.x)/2,my=(fp.y+tp.y)/2;
      const tw=wr.label.length*6.5+12;
      s+='<rect x="'+(mx-tw/2)+'" y="'+(my-10)+'" width="'+tw+'" height="20" rx="4" fill="'+wr.color+'" opacity="0.9"/>';
      s+='<text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">'+wr.label+'</text>';
    }
  });

  comps.forEach(comp=>{
    const sel=selectedComp===comp.id;
    const ch=compH(comp);
    const cx=comp.x+panOff.x,cy=comp.y+panOff.y;
    s+='<g data-comp="'+comp.id+'" style="cursor:grab">';
    s+='<rect x="'+cx+'" y="'+cy+'" width="'+comp.w+'" height="'+ch+'" rx="6" fill="'+C.compBg+'" stroke="'+(sel?C.selStroke:comp.color)+'" stroke-width="'+(sel?2.5:1)+'"/>';
    s+='<rect x="'+cx+'" y="'+cy+'" width="'+comp.w+'" height="28" rx="6" fill="'+comp.color+'"/>';
    s+='<rect x="'+cx+'" y="'+(cy+22)+'" width="'+comp.w+'" height="6" fill="'+comp.color+'"/>';
    s+='<text x="'+(cx+comp.w/2)+'" y="'+(cy+18)+'" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">'+comp.name+'</text>';

    comp.ports.filter(p=>p.side==='left').forEach((port,i)=>{
      const py=cy+28+14+i*24;
      const isWiring=wiringFrom&&wiringFrom.comp===comp.id&&wiringFrom.port===port.id;
      s+='<circle cx="'+cx+'" cy="'+py+'" r="'+(isWiring?7:5)+'" fill="'+(isWiring?comp.color:C.portFill)+'" stroke="'+comp.color+'" stroke-width="1.5" data-comp="'+comp.id+'" data-port="'+port.id+'" style="cursor:crosshair"/>';
      s+='<text x="'+(cx+10)+'" y="'+(py+4)+'" font-size="10" fill="'+C.muted+'">'+port.name+'</text>';
    });
    comp.ports.filter(p=>p.side==='right').forEach((port,i)=>{
      const py=cy+28+14+i*24;
      const isWiring=wiringFrom&&wiringFrom.comp===comp.id&&wiringFrom.port===port.id;
      s+='<circle cx="'+(cx+comp.w)+'" cy="'+py+'" r="'+(isWiring?7:5)+'" fill="'+(isWiring?comp.color:C.portFill)+'" stroke="'+comp.color+'" stroke-width="1.5" data-comp="'+comp.id+'" data-port="'+port.id+'" style="cursor:crosshair"/>';
      s+='<text x="'+(cx+comp.w-10)+'" y="'+(py+4)+'" text-anchor="end" font-size="10" fill="'+C.muted+'">'+port.name+'</text>';
    });
    s+='</g>';
  });

  if(previewLine)s+='<line x1="'+previewLine.x1+'" y1="'+previewLine.y1+'" x2="'+previewLine.x2+'" y2="'+previewLine.y2+'" stroke="'+document.getElementById('wire-color').value+'" stroke-width="2" stroke-dasharray="6 3"/>';
  svg.innerHTML=s;
  renderInspector();
}

function renderInspector(){
  const el=document.getElementById('inspector');
  if(!selectedComp){el.className='inspector open';el.innerHTML='<div style="color:#58656f;font-size:12px;padding:2px 0">Click a component to select it — then add, remove, or rename its ports here.</div>';return;}
  const comp=comps.find(c=>c.id===selectedComp);
  if(!comp){el.className='inspector';return;}
  el.className='inspector open';
  const leftPorts=comp.ports.filter(p=>p.side==='left');
  const rightPorts=comp.ports.filter(p=>p.side==='right');
  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<div style="width:12px;height:12px;border-radius:3px;background:'+comp.color+'"></div>'+
        '<span style="font-weight:600;letter-spacing:-.01em">'+comp.name+'</span>'+
        '<span style="font-size:11px;color:#58656f">'+comp.type+'</span>'+
      '</div>'+
      '<div style="display:flex;gap:4px">'+
        '<button class="tool-btn" style="font-size:11px;padding:3px 8px" onclick="renameComp()"><i class="ti ti-edit" aria-hidden="true"></i> Rename</button>'+
        '<button class="tool-btn" style="font-size:11px;padding:3px 8px;color:#EF4444" onclick="deleteSelected()"><i class="ti ti-trash" aria-hidden="true"></i> Delete</button>'+
      '</div>'+
    '</div>'+
    '<div class="port-cols">'+
      '<div>'+
        '<div class="port-col-header"><i class="ti ti-arrow-bar-right" aria-hidden="true" style="font-size:13px;margin-right:5px"></i> Inputs (left side)</div>'+
        '<div class="port-list">'+leftPorts.map(p=>
          '<div class="port-item">'+
            '<span style="flex:1;font-weight:500">'+p.name+'</span>'+
            '<button class="btn-danger-sm" onclick="renamePort(\''+p.id+'\')"><i class="ti ti-edit" style="font-size:11px"></i> Rename</button>'+
            '<button class="btn-danger-sm" onclick="removePort(\''+p.id+'\')"><i class="ti ti-trash" style="font-size:11px"></i> Remove</button>'+
          '</div>'
        ).join('')+
        (leftPorts.length===0?'<div style="font-size:11px;color:#58656f;padding:5px 2px;font-style:italic">No input ports</div>':'')+
        '</div>'+
        '<button class="add-port-btn" onclick="addPort(\'left\')"><i class="ti ti-plus" aria-hidden="true"></i> Add input port</button>'+
      '</div>'+
      '<div>'+
        '<div class="port-col-header"><i class="ti ti-arrow-bar-left" aria-hidden="true" style="font-size:13px;margin-right:5px"></i> Outputs (right side)</div>'+
        '<div class="port-list">'+rightPorts.map(p=>
          '<div class="port-item">'+
            '<span style="flex:1;font-weight:500">'+p.name+'</span>'+
            '<button class="btn-danger-sm" onclick="renamePort(\''+p.id+'\')"><i class="ti ti-edit" style="font-size:11px"></i> Rename</button>'+
            '<button class="btn-danger-sm" onclick="removePort(\''+p.id+'\')"><i class="ti ti-trash" style="font-size:11px"></i> Remove</button>'+
          '</div>'
        ).join('')+
        (rightPorts.length===0?'<div style="font-size:11px;color:#58656f;padding:5px 2px;font-style:italic">No output ports</div>':'')+
        '</div>'+
        '<button class="add-port-btn" onclick="addPort(\'right\')"><i class="ti ti-plus" aria-hidden="true"></i> Add output port</button>'+
      '</div>'+
    '</div>';
}

function addPort(side){
  const comp=comps.find(c=>c.id===selectedComp);
  if(!comp)return;
  const name=prompt('Port name:','NEW');
  if(!name)return;
  const id='p'+Date.now();
  comp.ports.push({id,name:name.toUpperCase(),side});
  renderCanvas();save();
}
function removePort(pid){
  const comp=comps.find(c=>c.id===selectedComp);
  if(!comp)return;
  wires=wires.filter(w=>!((w.fromComp===comp.id&&w.fromPort===pid)||(w.toComp===comp.id&&w.toPort===pid)));
  comp.ports=comp.ports.filter(p=>p.id!==pid);
  renderCanvas();save();
}
function renamePort(pid){
  const comp=comps.find(c=>c.id===selectedComp);
  if(!comp)return;
  const port=comp.ports.find(p=>p.id===pid);
  if(!port)return;
  const name=prompt('Rename port:',port.name);
  if(name)port.name=name.toUpperCase();
  renderCanvas();save();
}
function renameComp(){
  const comp=comps.find(c=>c.id===selectedComp);
  if(!comp)return;
  const name=prompt('Rename component:',comp.name);
  if(name)comp.name=name;
  renderCanvas();save();
}

function addComp(type){
  const t=TEMPLATES[type];
  comps.push({id:nextCid++,type,name:t.name,color:t.color,x:60+comps.length*25-panOff.x,y:40+comps.length*20-panOff.y,w:140,ports:JSON.parse(JSON.stringify(t.ports))});
  selectedComp=comps[comps.length-1].id;selectedWire=null;
  renderCanvas();save();
}

function deleteSelected(){
  if(selectedWire){wires=wires.filter(w=>w.id!==selectedWire);selectedWire=null;}
  else if(selectedComp){wires=wires.filter(w=>w.fromComp!==selectedComp&&w.toComp!==selectedComp);comps=comps.filter(c=>c.id!==selectedComp);selectedComp=null;}
  renderCanvas();save();
}

// ── File System Access API persistence ──────────────────────────────────────
function setStatus(state,label){
  const chip=document.getElementById('save-status');
  const btnO=document.getElementById('btn-open-file');
  const btnN=document.getElementById('btn-new-file');
  const S={
    none:     {bg:'rgba(88,101,111,.15)', color:'#58656f', border:'rgba(88,101,111,.25)'},
    saving:   {bg:'rgba(77,159,255,.1)',  color:'#4d9fff', border:'rgba(77,159,255,.2)'},
    saved:    {bg:'rgba(63,185,80,.1)',   color:'#3fb950', border:'rgba(63,185,80,.2)'},
    reconnect:{bg:'rgba(196,127,23,.12)',color:'#c47f17', border:'rgba(196,127,23,.25)'},
    error:    {bg:'rgba(248,81,73,.1)',   color:'#f85149', border:'rgba(248,81,73,.2)'}
  };
  const s=S[state]||S.none;
  chip.textContent=label;chip.style.background=s.bg;chip.style.color=s.color;chip.style.borderColor=s.border;
  const noFile=(state==='none'||state==='reconnect');
  btnO.style.display=noFile?'':'none';btnN.style.display=noFile?'':'none';
}
function serializeState(){return JSON.stringify({parts,nextPid,comps,nextCid,wires,nextWid,logs,panOff});}
function save(){
  if(!fileHandle)return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    setStatus('saving','Saving…');
    fileHandle.createWritable()
      .then(w=>w.write(serializeState()).then(()=>w.close()))
      .then(()=>setStatus('saved',fileHandle.name))
      .catch(err=>{console.error('save:',err);setStatus('error','Save failed');});
  },200);
}

function getAttr(el,attr){while(el&&el!==svg){if(el.getAttribute&&el.getAttribute(attr))return el.getAttribute(attr);el=el.parentNode;}return null;}

svg.addEventListener('mousedown',e=>{
  const t=e.target;
  const pid=getAttr(t,'data-port');
  const cid=getAttr(t,'data-comp');
  const wid=getAttr(t,'data-wire');

  if(pid&&cid){
    const id=parseInt(cid);
    if(!wiringFrom){
      wiringFrom={comp:id,port:pid};
      const fc=comps.find(c=>c.id===id);
      const fp=portPos(fc,pid);
      previewLine={x1:fp.x,y1:fp.y,x2:fp.x,y2:fp.y};
      document.getElementById('hint').textContent='Click another port to complete wire. Esc to cancel.';
    }else{
      if(wiringFrom.comp!==id||wiringFrom.port!==pid){
        wires.push({id:nextWid++,fromComp:wiringFrom.comp,fromPort:wiringFrom.port,toComp:id,toPort:pid,color:document.getElementById('wire-color').value,label:document.getElementById('wire-label').value.trim(),gauge:document.getElementById('wire-gauge').value.trim()});
        save();
      }
      wiringFrom=null;previewLine=null;
      document.getElementById('hint').textContent='Drag components to move. Click port → port to wire. Double-click to rename.';
    }
    renderCanvas();e.stopPropagation();return;
  }

  if(wid){selectedWire=parseInt(wid);selectedComp=null;wiringFrom=null;previewLine=null;renderCanvas();e.stopPropagation();return;}

  if(cid&&!pid){
    const id=parseInt(cid);
    selectedComp=id;selectedWire=null;
    const comp=comps.find(c=>c.id===id);
    if(comp){
      const m=svgCoords(e);
      dragState={comp,ox:m.x-(comp.x+panOff.x),oy:m.y-(comp.y+panOff.y)};
    }
    renderCanvas();e.stopPropagation();return;
  }

  if(!wiringFrom){
    isPanning=true;panStart={x:e.clientX-panOff.x,y:e.clientY-panOff.y};
    svg.style.cursor='grabbing';
    selectedComp=null;selectedWire=null;renderCanvas();
  }
});

svg.addEventListener('mousemove',e=>{
  const m=svgCoords(e);
  if(dragState){
    dragState.comp.x=m.x-dragState.ox-panOff.x;
    dragState.comp.y=m.y-dragState.oy-panOff.y;
    renderCanvas();return;
  }
  if(isPanning){panOff.x=e.clientX-panStart.x;panOff.y=e.clientY-panStart.y;renderCanvas();return;}
  if(previewLine){previewLine.x2=m.x;previewLine.y2=m.y;renderCanvas();}
});

svg.addEventListener('mouseup',()=>{const wd=!!dragState,wp=isPanning;dragState=null;isPanning=false;svg.style.cursor='default';if(wd||wp)save();});
svg.addEventListener('mouseleave',()=>{const wd=!!dragState,wp=isPanning;dragState=null;isPanning=false;svg.style.cursor='default';if(wd||wp)save();});

svg.addEventListener('dblclick',e=>{
  const cid=getAttr(e.target,'data-comp');
  if(cid&&!getAttr(e.target,'data-port')){
    const comp=comps.find(c=>c.id===parseInt(cid));
    if(comp){const n=prompt('Rename:',comp.name);if(n){comp.name=n;renderCanvas();save();}}
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){wiringFrom=null;previewLine=null;document.getElementById('hint').textContent='Drag components to move. Click port → port to wire. Double-click to rename.';renderCanvas();}
  if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))deleteSelected();
});

function renderLog(){
  const el=document.getElementById('log-list');
  if(!logs.length){el.innerHTML='<div style="color:#58656f;font-size:13px">No entries yet.</div>';return;}
  el.innerHTML=[...logs].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(l=>
    '<div class="log-entry"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
    (l.type==='milestone'?'<div class="milestone-dot"></div>':'')+
    '<div class="log-date">'+l.date+'</div>'+
    (l.type==='milestone'?'<span class="badge badge-milestone">milestone</span>':'')+
    '</div><div class="log-title">'+l.title+'</div>'+
    (l.notes?'<div class="log-notes">'+l.notes+'</div>':'')+'</div>'
  ).join('');
}
function addLog(){
  const title=document.getElementById('l-title').value.trim();if(!title)return;
  logs.push({title,date:document.getElementById('l-date').value||new Date().toISOString().slice(0,10),type:document.getElementById('l-type').value,notes:document.getElementById('l-notes').value.trim()});
  document.getElementById('l-title').value='';document.getElementById('l-notes').value='';renderLog();save();
}

function loadFromFile(handle){
  return handle.getFile().then(f=>f.text()).then(text=>{
    const d=JSON.parse(text);
    if(Array.isArray(d.parts))parts=d.parts;
    if(typeof d.nextPid==='number')nextPid=d.nextPid;
    if(Array.isArray(d.comps))comps=d.comps;
    if(typeof d.nextCid==='number')nextCid=d.nextCid;
    if(Array.isArray(d.wires))wires=d.wires;
    if(typeof d.nextWid==='number')nextWid=d.nextWid;
    if(Array.isArray(d.logs))logs=d.logs;
    if(d.panOff&&typeof d.panOff.x==='number')panOff=d.panOff;
    renderParts();renderCanvas();renderLog();
  });
}
function initSaveFile(){
  idbGet().then(handle=>{
    if(!handle){setStatus('none','No save file');return;}
    return handle.queryPermission({mode:'readwrite'}).then(perm=>{
      if(perm==='granted'){
        fileHandle=handle;
        return loadFromFile(handle).then(()=>setStatus('saved',handle.name));
      }else{
        setStatus('reconnect','Reconnect: '+handle.name);
        const btnO=document.getElementById('btn-open-file');
        btnO.textContent='Reconnect';
        btnO.onclick=function(){
          handle.requestPermission({mode:'readwrite'}).then(p=>{
            btnO.textContent='Open file';btnO.onclick=openSaveFile;
            if(p==='granted'){fileHandle=handle;return loadFromFile(handle).then(()=>setStatus('saved',handle.name));}
            else setStatus('none','No save file');
          });
        };
      }
    });
  }).catch(err=>{console.warn('initSaveFile:',err);setStatus('none','No save file');});
}
function openSaveFile(){
  showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false})
    .then(([handle])=>{
      fileHandle=handle;
      return idbPut(handle).then(()=>loadFromFile(handle)).then(()=>setStatus('saved',handle.name));
    })
    .catch(err=>{if(err.name!=='AbortError'){console.error('openSaveFile:',err);setStatus('error','Open failed');}});
}
function newSaveFile(){
  showSaveFilePicker({suggestedName:'vehicle-tracker.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]})
    .then(handle=>{fileHandle=handle;return idbPut(handle).then(()=>save());})
    .catch(err=>{if(err.name!=='AbortError'){console.error('newSaveFile:',err);setStatus('error','Create failed');}});
}

renderParts();
initSaveFile();
</script>
